about:
  name: chen
  title: 全栈开发者 & 开源爱好者
  avatar: >-
    https://img.shiyangya.dpdns.org/file/tx/1777965689638_0fda015c370738031da0f9dc15b4d75b.webp
  bio:
    - 👋 你好！我是 chen一名热爱技术的全栈开发者。
    - 💻 专注于前端开发和用户体验设计，喜欢探索新技术，享受用代码解决问题的过程。
    - 🌱 坚信开源精神，积极参与开源项目，相信技术可以让世界变得更美好。
  github: kobaridev
  techStack:
    - name: Astro
      icon: simple-icons:astro
      color: oklch(0.5 0.2 300)
    - name: JavaScript
      icon: simple-icons:javascript
      color: oklch(0.8 0.2 80)
    - name: TypeScript
      icon: simple-icons:typescript
      color: oklch(0.6 0.2 250)
    - name: React
      icon: simple-icons:react
      color: oklch(0.7 0.2 200)
    - name: Node.js
      icon: simple-icons:nodedotjs
      color: oklch(0.7 0.2 140)
    - name: TailwindCSS
      icon: simple-icons:tailwindcss
      color: oklch(0.6 0.2 220)
    - name: HTML5
      icon: simple-icons:html5
      color: oklch(0.7 0.2 30)
    - name: CSS3
      icon: simple-icons:css3
      color: oklch(0.7 0.2 220)
    - name: Git
      icon: simple-icons:git
      color: oklch(0.7 0.2 30)
    - name: Python
      icon: simple-icons:python
      color: oklch(0.7 0.2 250)
    - name: Docker
      icon: simple-icons:docker
      color: oklch(0.6 0.2 200)
    - name: Vue.js
      icon: simple-icons:vuedotjs
      color: oklch(0.6 0.2 120)
  aboutSite:
    intro: 这是我的个人博客，一个简洁、优雅、快速的静态博客系统，基于 Astro 5.0+ & Tailwind CSS 构建。
    sections:
      - title: 核心特色
        items:
          - 📝 在线发布：无需本地环境，浏览器中直接编写和发布文章
          - ⚙️ 可视化配置：Web界面管理网站设置，零代码操作
          - 🚀 极速体验：基于 Astro 构建，提供极速的访问速度与优秀的 SEO
          - 🎨 优雅设计：使用 Tailwind CSS 与 daisyUI，支持深色/浅色主题
          - 📱 完美适配：移动端优先的响应式设计，优化卡片布局与网格导航
          - 🔍 智能搜索：集成 Pagefind，毫秒级全文搜索
          - ⚡ 流畅动画：ClientRouter 实现丝滑的页面过渡效果
      - title: 功能亮点
        items:
          - 📚 追番管理：集成 TMDB API，记录和分享喜欢的动漫作品
          - 🧭 网站导航：分类整理常用工具和资源链接
          - 👥 友链展示：展示朋友们的优秀博客和项目
          - 📊 数据统计：集成 Umami 分析，了解网站访问情况
          - 💬 评论系统：支持 Giscus 和 Waline，与读者互动交流
